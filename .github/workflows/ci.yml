name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests with coverage
        run: npm run test:coverage
        env:
          CI: true
      - name: Production build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.test
          VITE_SUPABASE_ANON_KEY: ci-anon-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: reports/
          retention-days: 14

  e2e:
    name: End-to-end (Chromium, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            reports/
            test-results/
          retention-days: 14
